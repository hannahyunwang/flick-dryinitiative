<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="View the original Flick-dry infographic: wash, flick excess water over the sink, then dry your hands.">
  <meta name="referrer" content="no-referrer">
  <title>Infographic — Flick-dry Initiative</title>
  <link rel="canonical" href="https://flick-dryinitiative.org/infographic/">
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #12342e; background: #eef4ef; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { max-width: 840px; margin: 0 auto; padding: 24px 20px 16px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: clamp(20px, 4vw, 28px); margin: 0; line-height: 1.3; }
    a { color: #194f47; text-underline-offset: 4px; }
    header a { display: inline-flex; align-items: center; min-height: 44px; }
    a:focus-visible { outline: 3px solid #194f47; outline-offset: 5px; }
    main { max-width: 840px; padding: 0 20px 28px; margin: 0 auto; }
    figure { margin: 0; }
    img { display: block; width: 100%; height: auto; background: #fff; box-shadow: 0 6px 24px #12342e18; }
    figcaption { margin-top: 16px; font-size: 15px; line-height: 1.5; text-align: center; }
    @media (max-width: 480px) { header { padding: 12px 12px 8px; } main { padding: 0 12px 20px; } }
    @media print { header a, figcaption { display: none; } :root { background: white; } header, main { max-width: none; padding: 0; } h1 { margin-bottom: 12px; } img { box-shadow: none; } }
  </style>
</head>
<body>
  <header>
    <h1>Flick-dry infographic</h1>
    <a href="/">Visit Flick-dry Initiative</a>
  </header>
  <main>
    <figure>
      <img src="/assets/images/flick-dry-infographic-original.png" width="1390" height="1995" alt="Flick-dry infographic: wash and rinse your hands, flick 12 times over the sink while keeping splashes contained, then use the hand dryer until your hands feel dry. Includes website and Instagram QR codes.">
      <figcaption>Original artwork. Use your browser’s zoom controls to enlarge it.</figcaption>
    </figure>
  </main>
</body>
</html>
