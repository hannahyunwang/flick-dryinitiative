<g transform="translate(889 1128) scale(-.34 .34) rotate(202)"><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#hand"/></g>
<text x="861" y="1170" text-anchor="middle" class="body">Use the hand dryer.</text>
<text x="861" y="1211" text-anchor="middle" class="small">Stop when your hands feel dry.</text>

<path d="M 575 1035 L 621 1035 M 610 1024 L 621 1035 L 610 1046" fill="none" stroke="#185842" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="1419" text-anchor="middle" style="font-size:25px;font-weight:700;fill:#185842">Less water to dry can mean less dryer time.</text>
