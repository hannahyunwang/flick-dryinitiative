<rect width="1200" height="1860" fill="#f6f7ee"/>
<text x="64" y="77" class="label" fill="#185842">FLICK-DRY INITIATIVE</text>
<text x="60" y="172" class="title">Wash. Then flick-dry.</text>
<text x="64" y="226" class="body">Clean hands. A little less water to dry.</text>

<!-- Main step one -->
<rect x="60" y="277" width="1080" height="310" rx="25" fill="#fff" stroke="#cdd9cc" stroke-width="2"/>
<circle cx="124" cy="344" r="32" fill="#185842"/>
<text x="124" y="356" text-anchor="middle" style="font-size:33px;font-weight:700;fill:white">1</text>
<text x="184" y="362" style="font-size:49px;font-weight:700">Wash</text>
<text x="184" y="430" class="body">Wash your hands</text>
<text x="184" y="471" class="body">with soap and water.</text>
<text x="184" y="529" class="small">Rinse well before flick-drying.</text>
<!-- washing hands and soap bubbles -->
<g transform="translate(865 535) rotate(-150) scale(.85) translate(-77 0)"><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#hand"/></g>
<g transform="translate(945 535) scale(-1 1) rotate(-150) scale(.85) translate(-77 0)"><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#hand"/></g>
<g fill="#f6f7ee" stroke="#73a9a1" stroke-width="3">
<circle cx="815" cy="428" r="18"/><circle cx="835" cy="450" r="15"/><circle cx="984" cy="466" r="20"/><circle cx="1005" cy="444" r="12"/>
<circle cx="810" cy="370" r="12"/><circle cx="993" cy="371" r="15"/><circle cx="1026" cy="411" r="8"/>
</g>

<!-- Main step two, enclosing both substeps -->
<rect x="60" y="620" width="1080" height="844" rx="25" fill="#edf1de" stroke="#cdd9cc" stroke-width="2"/>
<circle cx="124" cy="689" r="32" fill="#185842"/>
<text x="124" y="701" text-anchor="middle" style="font-size:33px;font-weight:700;fill:white">2</text>
<text x="184" y="708" style="font-size:49px;font-weight:700">Flick-dry</text>
<text x="184" y="757" class="body">Flick excess water off. Then dry using a hand dryer.</text>

<rect x="88" y="797" width="498" height="560" rx="18" fill="#fff"/>
<rect x="610" y="797" width="502" height="560" rx="18" fill="#fff"/>
<rect x="116" y="824" width="63" height="42" rx="21" fill="#e4ed99"/>
<text x="148" y="853" text-anchor="middle" style="font-size:22px;font-weight:700">2a</text>
<text x="195" y="857" style="font-size:33px;font-weight:700">Flick</text>
<rect x="638" y="824" width="63" height="42" rx="21" fill="#e4ed99"/>
<text x="670" y="853" text-anchor="middle" style="font-size:22px;font-weight:700">2b</text>
<text x="717" y="857" style="font-size:33px;font-weight:700">Dry</text>

