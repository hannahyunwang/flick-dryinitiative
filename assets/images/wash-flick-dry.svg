<text x="337" y="1200" text-anchor="middle" class="body" style="fill:#3661f7;font-weight:700">Flick 12 times</text>
<text x="337" y="1245" text-anchor="middle" class="body">over the sink.</text>
<text x="337" y="1295" text-anchor="middle" class="small">Keep splashes contained.</text>

<!-- dryer, airflow, hands -->
<rect x="778" y="897" width="168" height="111" rx="23" fill="#edf1de" stroke="#185842" stroke-width="5"/>
<path d="M 798 920 L 926 920" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
